name: quota-guard

on:
  schedule:
    # SAFETY-NET ONLY. The real plan is built by lead-miner's "plan" job right
    # after mining. This cron just re-checks plan completeness; on a healthy
    # day it writes ZERO entries (idempotent). Cron time unchanged.
    - cron: '30 12 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '1 = diagnose only, write nothing'
        required: false
        default: '1'

permissions:
  contents: write

# Shared with lead-miner's plan job so the two builders can never write the
# schedule Secret at the same time. The sender chain uses its own group.
concurrency:
  group: schedule-plan
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install tzdata pynacl
      - name: Build front-loaded plan (fill entire runway)
        env:
          DATA_KEY: ${{ secrets.DATA_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
          SCHEDULE_B64_1: ${{ secrets.SCHEDULE_B64_1 }}
          SCHEDULE_B64_2: ${{ secrets.SCHEDULE_B64_2 }}
          SCHEDULE_B64_3: ${{ secrets.SCHEDULE_B64_3 }}
          SCHEDULE_B64_4: ${{ secrets.SCHEDULE_B64_4 }}
          SCHEDULE_B64_5: ${{ secrets.SCHEDULE_B64_5 }}
          SCHEDULE_B64_6: ${{ secrets.SCHEDULE_B64_6 }}
          SCHEDULE_B64_7: ${{ secrets.SCHEDULE_B64_7 }}
          SCHEDULE_B64_8: ${{ secrets.SCHEDULE_B64_8 }}
          SCHEDULE_B64_9: ${{ secrets.SCHEDULE_B64_9 }}
          SCHEDULE_B64_10: ${{ secrets.SCHEDULE_B64_10 }}
          DAILY_CAP: '20'
          LOOKAHEAD_DAYS: '45'
          # Place ALL qualified leads in one pass, not a rolling trickle.
          # Real limit is the validated pool size; 300 is only a runaway guard.
          MAX_FILL: '300'
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
        run: python quota_guard.py
