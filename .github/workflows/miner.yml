name: lead-miner

on:
  schedule:
    - cron: '30 17 * * *'      # 01:30 BJT daily
  workflow_dispatch:
    inputs:
      batch:
        description: 'domains to mine this run'
        required: false
        default: '180'

permissions:
  contents: write

concurrency:
  group: lead-miner
  cancel-in-progress: false

jobs:
  mine:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Mine leads from domain corpus
        env:
          DATA_KEY: ${{ secrets.DATA_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MINE_BATCH: ${{ github.event.inputs.batch || '180' }}
        run: python miner.py

  # FRONT-LOADED PLANNING: as soon as the mining/background-check/validation
  # job finishes, turn every newly qualified lead into a fully-composed,
  # compliance-checked schedule entry on a FUTURE BJT day. Nothing is ever
  # scrambled together at send time -- the sender only delivers the plan.
  plan:
    needs: mine
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Same group as the quota-guard safety net -> no concurrent Secret writes.
    concurrency:
      group: schedule-plan
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install tzdata pynacl
      - name: Build front-loaded plan from validated pool
        env:
          DATA_KEY: ${{ secrets.DATA_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
          SCHEDULE_B64_1: ${{ secrets.SCHEDULE_B64_1 }}
          SCHEDULE_B64_2: ${{ secrets.SCHEDULE_B64_2 }}
          SCHEDULE_B64_3: ${{ secrets.SCHEDULE_B64_3 }}
          SCHEDULE_B64_4: ${{ secrets.SCHEDULE_B64_4 }}
          SCHEDULE_B64_5: ${{ secrets.SCHEDULE_B64_5 }}
          SCHEDULE_B64_6: ${{ secrets.SCHEDULE_B64_6 }}
          SCHEDULE_B64_7: ${{ secrets.SCHEDULE_B64_7 }}
          SCHEDULE_B64_8: ${{ secrets.SCHEDULE_B64_8 }}
          SCHEDULE_B64_9: ${{ secrets.SCHEDULE_B64_9 }}
          SCHEDULE_B64_10: ${{ secrets.SCHEDULE_B64_10 }}
          DAILY_CAP: '20'
          LOOKAHEAD_DAYS: '45'
          MAX_FILL: '300'
          DRY_RUN: '0'
        run: python quota_guard.py
