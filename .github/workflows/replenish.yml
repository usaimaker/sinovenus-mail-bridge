name: schedule-replenish

on:
  schedule:
    - cron: '10 19 * * *'      # 03:10 BJT daily, after the miner has run
  workflow_dispatch:
    inputs:
      dry_run:
        description: '1 = diagnose only, write nothing'
        required: false
        default: '1'

permissions:
  contents: write

# MUST match lead-miner's plan job and quota-guard: all three write the same
# SCHEDULE_B64_* Secrets. A separate group used to allow concurrent writes.
concurrency:
  group: schedule-plan
  cancel-in-progress: false

jobs:
  replenish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install tzdata pynacl
      # ONE compliant planner. cloud_replenish.py used to rebuild + RENUMBER the
      # whole schedule here (re-sending already-contacted leads) and its daily
      # cap never matched because of a date/string key mismatch. It is now a
      # read-only diagnostic; quota_guard.py does append-only planning.
      - name: Extend runway with the single compliant planner
        env:
          DATA_KEY: ${{ secrets.DATA_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
          SCHEDULE_B64_1: ${{ secrets.SCHEDULE_B64_1 }}
          SCHEDULE_B64_2: ${{ secrets.SCHEDULE_B64_2 }}
          SCHEDULE_B64_3: ${{ secrets.SCHEDULE_B64_3 }}
          SCHEDULE_B64_4: ${{ secrets.SCHEDULE_B64_4 }}
          SCHEDULE_B64_5: ${{ secrets.SCHEDULE_B64_5 }}
          SCHEDULE_B64_6: ${{ secrets.SCHEDULE_B64_6 }}
          SCHEDULE_B64_7: ${{ secrets.SCHEDULE_B64_7 }}
          SCHEDULE_B64_8: ${{ secrets.SCHEDULE_B64_8 }}
          SCHEDULE_B64_9: ${{ secrets.SCHEDULE_B64_9 }}
          SCHEDULE_B64_10: ${{ secrets.SCHEDULE_B64_10 }}
          DAILY_CAP: '20'
          MIN_RUNWAY_DAYS: '5'
          LOOKAHEAD_DAYS: '45'
          MAX_FILL: '300'
          EXTEND_RUNWAY: '1'
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
        run: python -u quota_guard.py
